# Keeps lower branches in sync after something lands on a higher one, by opening (never merging)
# a back-merge PR one level down:  main -> staging -> dev  (or main -> dev when there is no staging).
# Merge these PRs with a MERGE COMMIT, never squash (see standards 02). Needs the repo setting
# "Allow GitHub Actions to create and approve pull requests" (tools/repo-setup/protect-branches.sh sets it).
# Not used in a main-only repo.
name: back-merge

on:
  push:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-back-merge-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or reuse the back-merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.ref_name }}
        run: |
          has() { git ls-remote --exit-code --heads origin "$1" >/dev/null 2>&1; }
          TARGET=""
          if [ "$SOURCE" = "main" ]; then
            if has staging; then TARGET=staging; elif has dev; then TARGET=dev; fi
          elif [ "$SOURCE" = "staging" ] && has dev; then
            TARGET=dev
          fi
          if [ -z "$TARGET" ]; then echo "No lower branch to back-merge into."; exit 0; fi

          git fetch origin "$TARGET"
          if git diff --quiet "origin/$TARGET" "origin/$SOURCE"; then
            echo "$TARGET already has everything from $SOURCE."; exit 0
          fi
          if git merge-base --is-ancestor "origin/$SOURCE" "origin/$TARGET"; then
            echo "$SOURCE is already contained in $TARGET."; exit 0
          fi
          EXISTING=$(gh pr list --base "$TARGET" --head "$SOURCE" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then echo "PR #$EXISTING already open."; exit 0; fi
          gh pr create --base "$TARGET" --head "$SOURCE" \
            --title "chore(sync): back-merge $SOURCE into $TARGET" \
            --body "Opened automatically so \`$TARGET\` keeps what shipped on \`$SOURCE\` (release, version bump, hotfix). Review and merge with a **merge commit**. It never merges itself."
